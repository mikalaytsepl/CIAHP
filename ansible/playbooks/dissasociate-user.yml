---
- name: Disassociate User from Cluster Access
  hosts: "{{ target_cluster }}_managers"
  become: true

  tasks:
    - name: Check if .kube directory exists
      ansible.builtin.stat:
        path: "/home/{{ target_user }}/.kube"
      register: kube_dir

    - name: Remove .kube configuration directory
      ansible.builtin.file:
        path: "/home/{{ target_user }}/.kube"
        state: absent
      when: kube_dir.stat.exists

    - name: Verify kubectl access is revoked
      ansible.builtin.command: kubectl get nodes
      environment:
        KUBECONFIG: "/home/{{ target_user }}/.kube/config"
      register: revocation_check
      failed_when: false
      changed_when: false

    - name: Confirm Revocation
      ansible.builtin.debug:
        msg: "Access revoked. kubectl now returns: {{ revocation_check.stderr }}"
      when: revocation_check.rc != 0

    - name: Warn if access still exists
      ansible.builtin.fail:
        msg: "User {{ target_user }} still has access! Check for other config locations."
      when: revocation_check.rc == 0