---
- name: Find an active manager to retrieve credentials
  hosts: localhost
  gather_facts: false
  tasks:
    - name: Select an active manager for execution
      ansible.builtin.set_fact:
        # Grabs the first available manager in the list
        exec_manager: "{{ groups[target_cluster + '_managers'] | first }}"

- name: Retrieve Information from Manager
  hosts: "{{ hostvars['localhost']['exec_manager'] }}"
  become: true
  tasks:
    - name: Get join command
      ansible.builtin.command: kubeadm token create --print-join-command
      register: join_command_raw

    - name: Get installed Kube version
      ansible.builtin.shell: kubeadm version -o short | cut -d'v' -f2
      register: detected_version
      changed_when: false

    - name: Share facts with all hosts
      ansible.builtin.set_fact:
        shared_join_command: "{{ join_command_raw.stdout }}"
        shared_kube_version: "{{ detected_version.stdout | trim }}"
        active_manager: "{{ inventory_hostname }}"
      run_once: true

- name: Deploy Worker Node
  hosts: "{{ target_node | default(target_cluster + '_workers')}}"
  become: true
  vars:
    KUBE_VERSION: "{{ hostvars[groups[target_cluster + '_managers'][0]]['shared_kube_version'] }}"
    JOIN_COMMAND: "{{ hostvars[groups[target_cluster + '_managers'][0]]['shared_join_command'] }}"
    ACTIVE_MANAGER: "{{ hostvars[groups[target_cluster + '_managers'][0]]['active_manager'] }}"
    TARGET_CLUSTER: "{{ target_cluster }}"
    VIP_ADDRESS: "{{ cluster_vip }}"

  tasks:
    - name: Run General Setup
      ansible.builtin.import_tasks: ../tasks/general_setup.yml

    - name: Run Worker Join
      ansible.builtin.import_tasks: ../tasks/join_worker.yml