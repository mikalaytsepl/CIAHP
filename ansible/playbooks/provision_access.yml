---
- name: Provision human access account
  hosts: "{{ target_node | default(target_cluster) }}"
  become: true
  gather_facts: false

  tasks:
    - name: Ensure access user exists (admin) with a bash shell
      ansible.builtin.user:
        name: "{{ access_user }}"
        shell: /bin/bash
        groups: sudo
        append: yes
        create_home: yes

    - name: Grant passwordless sudo to the access user
      ansible.builtin.copy:
        dest: "/etc/sudoers.d/{{ access_user }}"
        content: "{{ access_user }} ALL=(ALL) NOPASSWD: ALL"
        mode: '0440'
        validate: /usr/sbin/visudo -cf %s

    - name: Install SSH public key (key auth)
      ansible.posix.authorized_key:
        user: "{{ access_user }}"
        state: present
        key: "{{ public_key }}"
        exclusive: no
      when: auth_method == 'key'

    - name: Set account password (password auth)
      ansible.builtin.command:
        cmd: chpasswd
        stdin: "{{ access_user }}:{{ lookup('env', 'CIAHP_ACCESS_PW') }}"
      no_log: true
      when: auth_method == 'password'
