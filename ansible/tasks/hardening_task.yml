- name: Pre-Flight Checks
  block:
    - name: Verify passwordless sudo works for the Ansible user
      ansible.builtin.command: sudo -n true
      become: false
      changed_when: false
      register: sudo_check
      ignore_errors: true

    - name: Fail if passwordless sudo is missing
      ansible.builtin.fail:
        msg: "The user running Ansible does not have NOPASSWD configured in /etc/sudoers. Hardening will lock you out!"
      when: sudo_check.rc != 0

- name: SSH Hardening
  block:
    - name: Disable root login
      ansible.builtin.lineinfile:
        dest: /etc/ssh/sshd_config
        regexp: '^#?PermitRootLogin'
        line: 'PermitRootLogin no'
        validate: '/usr/sbin/sshd -t -f %s'
      notify: Restart SSH

    - name: Disable password authentication
      ansible.builtin.lineinfile:
        dest: /etc/ssh/sshd_config
        regexp: '^#?PasswordAuthentication'
        line: 'PasswordAuthentication no'
        validate: '/usr/sbin/sshd -t -f %s'
      notify: Restart SSH

- name: Kernel - Apply security sysctl parameters
  ansible.posix.sysctl:
    name: "{{ item.name }}"
    value: "{{ item.value }}"
    state: present
    reload: yes
  loop:
    - { name: 'net.ipv4.conf.all.rp_filter', value: '1' }
    - { name: 'net.ipv4.conf.default.rp_filter', value: '1' }
    - { name: 'net.ipv4.icmp_echo_ignore_broadcasts', value: '1' }
    - { name: 'net.ipv4.tcp_syncookies', value: '1' }
    - { name: 'net.ipv4.conf.all.accept_redirects', value: '0' }
    - { name: 'net.ipv4.conf.all.send_redirects', value: '0' }

- name: Accounts - Lock unused default system accounts
  ansible.builtin.user:
    name: "{{ item }}"
    shell: /usr/sbin/nologin
    password_lock: yes
  loop:
    - games
    - ftp
    - mail
    - irc
    - nobody
    - list
  ignore_errors: true