---
- name: Ensure human users exist with bash shells
  ansible.builtin.user:
    name: "{{ item.name }}"
    shell: /bin/bash
    groups: "{{ 'sudo' if item.is_admin else '' }}"
    append: yes
    create_home: yes
  loop: "{{ human_users }}"

- name: Inject SSH Public Keys for users
  ansible.posix.authorized_key:
    user: "{{ item.name }}"
    state: present
    key: "{{ item.key }}"
    exclusive: no
  loop: "{{ human_users }}"

- name: Configure passwordless sudo for admin users
  ansible.builtin.copy:
    dest: "/etc/sudoers.d/{{ item.name }}"
    content: "{{ item.name }} ALL=(ALL) NOPASSWD: ALL"
    mode: '0440'
    validate: /usr/sbin/visudo -cf %s
  loop: "{{ human_users }}"
  when: item.is_admin

- name: Remove passwordless sudo file if user is demoted from admin
  ansible.builtin.file:
    path: "/etc/sudoers.d/{{ item.name }}"
    state: absent
  loop: "{{ human_users }}"
  when: not item.is_admin